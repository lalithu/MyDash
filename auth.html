<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Canvas Dash Account</title><style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#27333d;background:#f6f7f8}*{box-sizing:border-box}body{margin:0;padding:36px 18px}.wrap{max-width:520px;margin:0 auto}.brand{font-size:14px;font-weight:800;color:#66727c;margin-bottom:18px}.card{background:#fff;border:1px solid #e4e8eb;border-radius:20px;padding:24px;box-shadow:0 12px 35px rgba(20,30,40,.06)}h1{font-size:28px;margin:0 0 6px}.sub{color:#6f7a84;margin-bottom:20px}.tabs{display:grid;grid-template-columns:1fr 1fr;background:#f1f3f5;border-radius:12px;padding:4px;margin-bottom:18px}.tab{border:0;background:transparent;padding:10px;border-radius:9px;font:inherit;font-weight:800;color:#6f7881;cursor:pointer}.tab.active{background:#fff;color:#27333d;box-shadow:0 1px 5px rgba(20,30,40,.08)}form{display:grid;gap:12px}label{font-size:12px;font-weight:800;color:#6f7982}input{width:100%;margin-top:5px;border:1px solid #dce2e7;border-radius:10px;padding:11px 12px;font:inherit;font-size:15px}.btn{border:0;border-radius:11px;padding:12px 16px;background:#27333d;color:#fff;font:inherit;font-weight:800;cursor:pointer;margin-top:4px}.btn:disabled{opacity:.55}.status{margin-top:14px;font-size:13px;color:#65717b;min-height:20px}.status.err{color:#a23d3d}.status.ok{color:#2f7d52}.hidden{display:none}</style></head>
<body><div class="wrap"><div class="brand">Canvas Dash</div><div class="card"><h1 id="title">Create your account</h1><div class="sub">One account powers friends, invites, groups, and shared availability.</div><div class="tabs"><button id="signup-tab" class="tab active" type="button">Sign up</button><button id="signin-tab" class="tab" type="button">Sign in</button></div>
<form id="auth-form"><div id="profile-fields"><label>Display name<input id="display-name" autocomplete="name" placeholder="Lalith Uriti"></label><label>Canvas Dash ID<input id="username" autocomplete="username" placeholder="@lalith"></label><label>School<input id="school" placeholder="UNC Charlotte"></label></div><label>Email<input id="email" type="email" autocomplete="email" required placeholder="you@example.com"></label><label>Password<input id="password" type="password" autocomplete="current-password" minlength="6" required placeholder="6+ characters"></label><button id="submit" class="btn" type="submit">Create account</button></form><div id="status" class="status"></div></div></div><script src="supabase-config.js"></script><script src="auth.bundle.js"></script></body></html>
