name: Extension checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/social.test.cjs
      - run: node tests/schedule.test.cjs
      - run: node tests/auth.test.cjs
      - run: for file in *.js; do node --check "$file"; done
